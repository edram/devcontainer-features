name: "Update Documentation"
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: "Generate Documentation"
        uses: devcontainers/action@v1
        with:
          generate-docs: "true"
          base-path-to-features: "./src"
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Create PR for Documentation
        id: create_pr
        env:
          # A PAT is used (instead of the default GITHUB_TOKEN) so that the
          # opened PR is able to trigger other workflows, e.g. test.yaml.
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: |
          set -e
          echo "Start."

          # Configure git and push updates
          git config --global user.email github-actions@github.com
          git config --global user.name github-actions
          git config pull.rebase false

          branch="automated-documentation-update-$GITHUB_RUN_ID"
          git checkout -b "$branch"
          message='Automated documentation update'

          # Add / update and commit
          git add */**/README.md
          git commit -m "$message [skip ci]" || export NO_UPDATES=true

          # Push and open a PR if there were changes
          if [ "$NO_UPDATES" != "true" ] ; then
              git push origin "$branch"
              gh pr create --title "$message" --body "$message"
          fi
