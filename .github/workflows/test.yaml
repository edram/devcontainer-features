name: "CI - Test Features"
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        include:
          - feature: claude-code
            baseImage: mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm
          - feature: codex
            baseImage: mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for '${{ matrix.feature }}' against '${{ matrix.baseImage }}'"
        run: devcontainer features test --features ${{ matrix.feature }} --base-image ${{ matrix.baseImage }} .
